#lock screen inspirado en caelestia
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

$Scripts = $HOME/.config/hypr/scripts
$avatar = $HOME/.face
$message = Que Maravilla Crearemos Hoy

general {
  fractional_scaling = 2
  immediate_render = true
}

# animaciones
animations {
  enabled = true
  bezier = easeOut, 0.16, 1, 0.3, 1
  animation = fadeIn, 1, 3, easeOut, fadeOut
  animation = inputFieldFade, 1, 2, easeOut
}

# fondo
background {
  monitor =
  path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
  color = rgb(0,0,0)
  blur_size = 1
  blur_passes = 1
  noise = 0.0117
  contrast = 1.3000
  brightness = 0.8000
  vibrancy = 0.2100
  vibrancy_darkness = 0.0
}

# Label Izquierda
label {
  monitor =
  text = cmd[update:3000] $Scripts/LockMedia.sh
  color = $color7
  font_size = 17
  font_family = ESPACION
  position = 60, 60
  halign = left
  valign = bottom
}

#Label Derecha
label {
  monitor =
  text = cmd[update:5000] $Scripts/LockStats.sh
  color = $color7
  font_size = 17
  font_family = Inner Medium
  position = 20
  halign = right
  valign = bottom
}

# Hora version 
label {
  monitor =
  text = cmd[update:1000] date +%I:%M\ %p
  color = $color13
  font_size = 110
  font_family = JetBrains Mono Extrabold
  position = 0, 70
  halign = center
  valign = center
}


# Fecha Español
label {
  monitor =
  text = cmd[update:18000000] LC_TIME=es_ES.utf8 date +"%A, %-d de %B"
  color = $color12
  font_size = 30
  font_family = Victor Mono Bold Italic
  position = 0, -10
  halign = center
  valign = center
}

# Campo de contraseña 
input-field {
  monitor =
  size = 280, 64
  outline_thickness = 2
  dots_size = 0.22
  dots_spacing = 0.24
  dots_center = true
  outer_color = $color8
  inner_color = rgba(255, 255, 255, 0.08)
  capslock_color = rgb(255,255,255)
  font_color = $color13
  fade_on_empty = false
  font_family = Victor Mono Bold Oblique
  placeholder_text = <i><span foreground="##FDFFE0">󰌾 contraseña</span></i>
  hide_input = false
  rounding = 32
  position = 0, -230
  halign = center
  valign = center
}

# Avatar
image {
  monitor =
  path = $avatar
  size = 180
  rounding = -1
  border_size = 0
  border_color = $color11
  rotate = 0
  reload_time = -1
  position = 0, -140
  halign = center
  valign = top
}

# mensaje del dia
label {
  text = $message
  color = $color12
  font_size = 36
  font_family = Nabla
  position = 0, -70
  halign = center
  valign = center
}

# Layout de teclado de arriba izq.
label {
  monitor =
  text = $LAYOUT
  color = $color8
  font_size = 16
  font_family = ESPACION
  position = 20
  halign = left
  valign = top
}

# Batería 
label {
  monitor =
  text = cmd[update:1000] echo "$($Scripts/Battery.sh)"
  color = $color8
  font_size = 16
  font_family = ArcadeClassic
  position = 10
  halign = right
  valign = top
}

# Uptime arriba der.
label {
  monitor =
  text = cmd[update:60000] echo "up $(uptime -p | sed 's/up //')"
  color = $color8
  font_size = 16
  font_family = BitCount Single 
  position = 20
  halign = center
  valign = top
}

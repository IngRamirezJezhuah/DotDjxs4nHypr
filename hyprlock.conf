#lock screen inspirado en caelestia
source $HOME/.config/hypr/wallust/wallust-hyprland.conf

$Scripts = $HOME/.config/hypr/scripts
$avatar = $HOME/.face
$message = Que Maravilla Crearemos Hoy

general {
  grace = 1
  fractional_scaling = 2
  immediate_render = true
}

background {
  monitor =
  path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
  color = rgb(0,0,0)

  blur_size = 3
  blur_passes = 2
  noise = 0.0117
  contrast = 1.3000
  brigthness = 0.8000
  vibrancy = 0.2100
  vibrancy_darkness = 0.0
}

# Hora version de 12hr
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%I:%M %p"")"
  color = $color13
  font_size = 110
  font_family = JetBrainsMono Nerd Font ExtraBold
  position = 0, 80
  halign = center
  valign = center
}


# Fecha Español
label {
  monitor =
  text = cmd[update:18000000] echo "$(date +"%A, %-d de %B")"
  color = $color12
  font_size = 24
  font_family = Victor Mono Bold Italic
  position = 0, -10
  halign = center
  valign = center
}

# Avatar
image {
  monitor =
  path = $avatar
  size = 110
  rounding = -1
  border_size = 0
  border_color = $color11
  rotate = 0
  reload_time = -1
  position = 0, -120
  halign = center
  valign = center
}

# Campo de contraseña 
input-field {
  monitor =
  size = 280, 64
  outline_thickness = 2
  dots_size = 0.22
  dots_spacing = 0.24
  dots_center = true
  outer_color = $color8
  inner_color = rgba(255, 255, 255, 0.08)
  capslock_color = rgb(255,255,255)
  font_color = $color13
  fade_on_empty = false
  font_family = Victor Mono Bold Oblique
  placeholder_text = <i><span foreground="##ffffff99">󰌾 Type Password</span></i>
  hide_input = false
  rounding = 32
  position = 0, -230
  halign = center
  valign = center
}
